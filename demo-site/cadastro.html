<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta — Banco Exemplo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
  <p class="banner">Site fictício para testes.</p>
  <h1>Criar conta</h1>
  <form data-demo>
    <label>Nome
      <input type="text" name="nome" autocomplete="name">
    </label>
    <label>E-mail
      <input type="email" name="email" autocomplete="username" required>
    </label>
    <label>Crie uma senha
      <input type="password" name="senha" autocomplete="new-password" required>
    </label>
    <label>Repita a senha
      <input type="password" name="confirmacao" autocomplete="new-password" required>
    </label>
    <button type="submit">Criar conta</button>
  </form>
  <p>Digite um e-mail, abra a extensão e clique em <strong>Gerar senha forte e salvar</strong>.</p>
  <p><a href="index.html">Voltar</a></p>
</main>
<script src="demo.js"></script>
</body>
</html>
